<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="ActiGallery ระบบจัดการอัลบั้มภาพกิจกรรม">
  <title>ActiGallery | ระบบจัดการอัลบั้ม</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-soft: #eef2ff;
      --background: #f6f8fc;
      --surface: #ffffff;
      --text: #172033;
      --muted: #758096;
      --border: #e7ebf3;
      --success: #15803d;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --radius: 18px;
      --shadow: 0 8px 28px rgba(24, 39, 75, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "Noto Sans Thai", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 13px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .10);
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #344054;
    }

    .hidden { display: none !important; }

    .muted { color: var(--muted); }

    .small { font-size: 12px; }

    .icon {
      width: 19px;
      height: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      transition: transform .15s, background .15s, border-color .15s;
    }

    .btn:active { transform: scale(.98); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-secondary {
      color: #344054;
      background: white;
      border-color: var(--border);
    }

    .btn-secondary:hover { background: #f8fafc; }

    .btn-danger {
      color: white;
      background: var(--danger);
    }

    .btn-danger-light {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: transparent;
    }

    .btn-quiet {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }

    .btn-block { width: 100%; }

    .btn-sm {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 9px;
    }

    .field { margin-bottom: 17px; }

    .field-help {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, .13), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(14, 165, 233, .10), transparent 28%),
        var(--background);
    }

    .login-card {
      width: min(100%, 420px);
      background: white;
      padding: 34px;
      border: 1px solid rgba(231, 235, 243, .9);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(25, 37, 70, .10);
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 17px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      box-shadow: 0 10px 22px rgba(79, 70, 229, .23);
    }

    .brand-mark .icon { width: 29px; height: 29px; }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .login-brand h1 {
      margin: 15px 0 4px;
      font-size: 26px;
      letter-spacing: -.8px;
    }

    .login-brand p { margin: 0; color: var(--muted); }

    .login-footer {
      margin-top: 20px;
      text-align: center;
    }

    .text-link {
      padding: 4px;
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 600;
    }

    .login-error {
      padding: 11px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: #991b1b;
      font-size: 13px;
    }

    .app-shell { min-height: 100vh; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: 258px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
    }

    .sidebar-brand {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
    }

    .sidebar-brand .brand-mark .icon {
      width: 23px;
      height: 23px;
    }

    .brand-title { font-weight: 800; font-size: 17px; letter-spacing: -.4px; }
    .brand-subtitle { color: var(--muted); font-size: 11px; }

    .sidebar-content {
      padding: 20px 13px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-label {
      margin: 12px 12px 8px;
      color: #98a2b3;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 0;
      background: transparent;
      color: #667085;
      text-align: left;
      padding: 12px 13px;
      margin-bottom: 4px;
      border-radius: 11px;
      font-weight: 600;
    }

    .nav-item:hover { background: #f8fafc; color: var(--text); }

    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .nav-item .icon { width: 18px; height: 18px; }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding: 14px;
    }

    .mini-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 5px 12px;
      min-width: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #e0e7ff;
    }

    .avatar .icon { width: 20px; height: 20px; }

    .mini-user-info { min-width: 0; flex: 1; }
    .mini-user-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-user-org { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .main-area {
      min-height: 100vh;
      margin-left: 258px;
    }

    .topbar {
      height: 78px;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 25;
      backdrop-filter: blur(16px);
    }

    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .page-heading { font-size: 18px; font-weight: 800; margin: 0; }
    .page-subheading { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-user-info { text-align: right; min-width: 0; }
    .topbar-user-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
    .topbar-user-org { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }

    .mobile-menu-btn { display: none; }

    .content {
      max-width: 1500px;
      padding: 28px 30px 45px;
      margin: 0 auto;
    }

    .welcome-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }

    .welcome-title { font-size: 25px; font-weight: 800; letter-spacing: -.6px; margin: 0 0 5px; }
    .welcome-desc { margin: 0; color: var(--muted); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 25px;
    }

    .stats-grid.manager-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stat-label { color: var(--muted); font-weight: 600; font-size: 12px; }
    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .stat-icon .icon { width: 21px; height: 21px; }
    .stat-number { font-size: 29px; line-height: 1.2; font-weight: 800; margin-top: 16px; letter-spacing: -.8px; overflow-wrap: anywhere; }
    .stat-foot { color: var(--muted); font-size: 11px; margin-top: 5px; }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { margin: 0; font-size: 15px; font-weight: 800; }
    .panel-subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .panel-body { padding: 20px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar .search-input { flex: 1; min-width: 180px; max-width: 360px; }
    .toolbar select { width: auto; min-width: 145px; }

    .table-wrap { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid #f0f2f7; vertical-align: middle; }
    th { background: #fafbfe; color: #667085; font-size: 11px; font-weight: 800; white-space: nowrap; }
    td { font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .table-primary { font-weight: 700; }
    .table-secondary { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .table-actions { display: flex; gap: 6px; align-items: center; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-neutral { background: #f2f4f7; color: #475467; }
    .badge-primary { background: var(--primary-soft); color: var(--primary-dark); }

    .empty-state {
      padding: 48px 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state .icon {
      width: 36px;
      height: 36px;
      color: #98a2b3;
      margin: 0 auto 12px;
    }

    .empty-state strong { display: block; color: #344054; margin-bottom: 4px; }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-top: 20px;
    }

    .album-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      background: white;
      transition: box-shadow .18s, transform .18s;
    }

    .album-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(24, 39, 75, .09);
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      object-fit: cover;
      background: #eef2f6;
    }

    .album-no-cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #f1f5f9);
      color: #818cf8;
    }

    .album-no-cover .icon { width: 36px; height: 36px; }

    .album-card-body { padding: 14px; }
    .album-card-title { font-weight: 800; margin: 0 0 5px; overflow-wrap: anywhere; }
    .album-card-description {
      color: var(--muted);
      font-size: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 36px;
    }

    .album-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; }
    .album-card-actions { display: flex; gap: 7px; margin-top: 13px; }

    .organization-logo {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 4px;
    }

    .logo-fallback {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 800;
      font-size: 17px;
      flex-shrink: 0;
    }

    .organization-cell { display: flex; align-items: center; gap: 11px; min-width: 200px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 18px;
    }

    .span-2 { grid-column: span 2; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }

    .upload-zone {
      border: 1.5px dashed #c7d2fe;
      background: #fafbff;
      border-radius: 15px;
      padding: 25px 18px;
      text-align: center;
      transition: background .2s, border-color .2s;
    }

    .upload-zone.drag-over {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .upload-zone .icon {
      width: 34px;
      height: 34px;
      color: var(--primary);
      margin: 0 auto 9px;
    }

    .upload-zone p { margin: 5px 0 14px; color: var(--muted); font-size: 12px; }

    .photo-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin: 19px 0 12px;
    }

    .photo-toolbar-left, .photo-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    .photo-item {
      position: relative;
      min-width: 0;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #eef2f6;
      border: 2px solid transparent;
      touch-action: pan-y;
      cursor: pointer;
    }

    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .photo-item.is-selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, .15);
    }

    .photo-selection {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border: 2px solid white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(16, 24, 40, .24);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .16);
    }

    .photo-item.is-selected .photo-selection {
      background: var(--primary);
      border-color: var(--primary);
    }

    .photo-selection .icon { width: 13px; height: 13px; }
    .photo-index {
      position: absolute;
      bottom: 7px;
      left: 7px;
      background: rgba(16, 24, 40, .68);
      color: white;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 10px;
    }

    .photo-item.dragging { opacity: .35; }
    .photo-item.drag-target { outline: 3px solid var(--primary); outline-offset: -3px; }

    .floating-selection-bar {
      position: fixed;
      z-index: 70;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      max-width: calc(100vw - 24px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 17px;
      background: #1d2433;
      color: white;
      box-shadow: 0 16px 40px rgba(16, 24, 40, .28);
      animation: slide-up .2s ease;
    }

    .floating-selection-bar .selection-count {
      font-weight: 700;
      white-space: nowrap;
      padding: 0 6px;
    }

    .floating-selection-bar .btn {
      padding: 9px 11px;
      font-size: 12px;
    }

    .floating-selection-bar .btn-secondary {
      color: white;
      background: #30394b;
      border-color: #3e485c;
    }

    .floating-selection-bar .btn-danger-light {
      color: #fecaca;
      background: #512b35;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .progress-card {
      padding: 17px;
      border: 1px solid #dbeafe;
      border-radius: 14px;
      background: #f8fbff;
      margin-top: 18px;
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .progress-title { font-weight: 800; }
    .progress-percent { font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }

    .progress-track {
      height: 9px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #4f46e5);
      transition: width .18s ease;
    }

    .progress-detail { margin-top: 9px; color: var(--muted); font-size: 12px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, .48);
      backdrop-filter: blur(4px);
      animation: fade-in .16s ease;
    }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: min(100%, 650px);
      max-height: min(88vh, 900px);
      overflow: auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .22);
      animation: modal-in .18s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(8px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal.modal-wide { width: min(100%, 900px); }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 17px; font-weight: 800; margin: 0; }
    .modal-description { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .modal-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: #667085;
      flex-shrink: 0;
    }

    .modal-body { padding: 22px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 16px 22px;
      border-top: 1px solid var(--border);
    }

    .confirm-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .confirm-icon .icon { width: 25px; height: 25px; }

    .confirm-content { text-align: center; padding: 12px 5px; }
    .confirm-content h3 { margin: 0 0 6px; font-size: 18px; }
    .confirm-content p { margin: 0; color: var(--muted); }

    .toast-region {
      position: fixed;
      z-index: 200;
      top: 18px;
      right: 18px;
      width: min(390px, calc(100vw - 36px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
      box-shadow: 0 12px 32px rgba(16, 24, 40, .14);
      animation: toast-in .2s ease;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast-icon {
      width: 25px;
      height: 25px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .toast-icon .icon { width: 15px; height: 15px; }
    .toast.success .toast-icon { background: var(--success-soft); color: var(--success); }
    .toast.error .toast-icon { background: var(--danger-soft); color: var(--danger); }
    .toast.info .toast-icon { background: var(--primary-soft); color: var(--primary); }
    .toast.warning .toast-icon { background: var(--warning-soft); color: var(--warning); }
    .toast-message { flex: 1; min-width: 0; }
    .toast-title { font-weight: 800; margin-bottom: 2px; }
    .toast-description { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(246, 248, 252, .82);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
    }

    .loading-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 25px 30px;
      min-width: 210px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e7ff;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin: 0 auto 13px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: rgba(8, 12, 22, .96);
      color: white;
    }

    .viewer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 16px 20px;
    }

    .viewer-image-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 10px;
    }

    .viewer-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .viewer-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 14px;
    }

    .viewer-btn {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: white;
      padding: 9px 13px;
    }

    .contact-list { display: grid; gap: 10px; }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .contact-link:hover { background: #f8fafc; }

    .contact-link .icon-box {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 11px;
    }

    .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    .category-chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 9px;
      padding: 7px 10px;
      margin: 0 5px 5px 0;
      font-size: 12px;
    }

    .org-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      margin-bottom: 15px;
    }

    .divider { height: 1px; background: var(--border); margin: 18px 0; }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(15, 23, 42, .4);
    }

    .notice {
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: #475467;
      font-size: 12px;
    }

    .notice strong { color: #344054; }

    @media (max-width: 1150px) {
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .content { padding: 24px 22px 40px; }
      .topbar { padding: 0 22px; }
    }

    @media (max-width: 800px) {
      .sidebar {
        transform: translateX(-100%);
        box-shadow: none;
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 18px 0 40px rgba(16, 24, 40, .12);
      }

      .mobile-overlay.show { display: block; }
      .main-area { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .topbar { height: 68px; padding: 0 16px; }
      .content { padding: 22px 16px 35px; }
      .topbar-user-info { display: none; }
      .page-heading { font-size: 16px; }
      .welcome-title { font-size: 22px; }
      .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .panel-header, .panel-body { padding: 16px; }
    }

    @media (max-width: 520px) {
      .login-card { padding: 25px 20px; border-radius: 20px; }
      .stats-grid { gap: 10px; }
      .stat-card { padding: 14px; border-radius: 14px; }
      .stat-number { font-size: 24px; margin-top: 12px; }
      .stat-icon { width: 35px; height: 35px; }
      .stat-icon .icon { width: 18px; height: 18px; }
      .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .album-card-body { padding: 11px; }
      .album-card-title { font-size: 13px; }
      .album-card-actions { flex-direction: column; }
      .album-card-actions .btn { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
      .photo-item { border-radius: 9px; }
      .photo-selection { width: 22px; height: 22px; top: 5px; right: 5px; }
      .photo-toolbar { align-items: flex-start; }
      .photo-toolbar-left, .photo-toolbar-right { width: 100%; }
      .photo-toolbar-right .btn { flex: 1; }
      .floating-selection-bar { gap: 5px; padding: 8px; bottom: calc(12px + env(safe-area-inset-bottom)); }
      .floating-selection-bar .btn { padding: 8px; font-size: 11px; }
      .floating-selection-bar .selection-count { font-size: 11px; padding: 0 3px; }
      .modal-backdrop { padding: 10px; }
      .modal { border-radius: 16px; max-height: 92vh; }
      .modal-header, .modal-body { padding: 17px; }
      .modal-footer { padding: 13px 17px; }
      .welcome-row { flex-direction: column; }
      .welcome-row > .btn { width: 100%; }
      .toolbar { width: 100%; }
      .toolbar .search-input { max-width: none; }
      .toolbar select { flex: 1; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";

    }

    function normalizeUsername(username) {
      return String(username || "").trim().toLowerCase();

    /*
     * Firebase Authentication ใช้ email/password
     * โค้ดนี้แปลง username เป็นรูปแบบบัญชีภายในของระบบ
     * Backend ที่สร้างผู้ใช้ต้องใช้รูปแบบเดียวกัน:
     * username@users.actigallery.app
     *
     * หาก Backend ปัจจุบันใช้วิธีอื่น ต้องปรับสองฝั่งให้ตรงกัน
     * ห้ามสร้างบัญชี Firebase ด้วยรูปแบบอีเมลคนละแบบ
     */
    function usernameToAuthEmail(username) {
      const normalized = normalizeUsername(username);
      if (!/^[a-z0-9._-]{3,64}$/.test(normalized)) {
        throw new Error("ชื่อผู้ใช้ต้องมี 3–64 ตัวอักษร และใช้ภาษาอังกฤษ ตัวเลข จุด ขีดกลาง หรือขีดล่าง");
      }
      return `${normalized}@users.actigallery.app`;
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = value?.toDate ? value.toDate() : new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return new Intl.DateTimeFormat("th-TH", {
        year: "numeric", month: "short", day: "numeric"
      }).format(date);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("th-TH").format(Number(value) || 0);
    }

    function displayName(profile = state.profile) {
      return profile?.fullName || profile?.name || profile?.displayName || profile?.username || "ผู้ใช้งาน";
    }

    function organizationName(profile = state.profile) {
      if (state.role === "admin") return "ผู้ดูแลระบบ";
      const org = state.organizations.find(item => item.id === profile?.organizationId);
      return org?.name || profile?.organizationName || "ไม่พบข้อมูลหน่วยงาน";
    }

    function isAdmin() { return state.role === "admin"; }

    function showToast(title, description = "", type = "success", duration = 4000) {
      const region = $("#toastRegion");
      const element = document.createElement("div");
      const symbol = type === "error" ? "alert" : type === "warning" ? "alert" : type === "info" ? "help" : "check-circle";
      element.className = `toast ${type}`;
      element.innerHTML = `
        <div class="toast-icon">${icon(symbol)}</div>
        <div class="toast-message">
          <div class="toast-title">${escapeHtml(title)}</div>
          <div class="toast-description">${escapeHtml(description)}</div>
        </div>
        <button class="modal-close" type="button" aria-label="ปิด">${icon("x")}</button>`;
      $(".modal-close", element).addEventListener("click", () => element.remove());
      region.appendChild(element);
      window.setTimeout(() => element.remove(), duration);
    }

    function setLoading(show, message = "กำลังดำเนินการ...") {
      const root = $("#loadingRoot");
      if (!show) {
        root.innerHTML = "";
        return;
      }
      root.innerHTML = `
        <div class="loading-overlay">
          <div class="loading-box">
            <div class="spinner"></div>
            <div style="font-weight:800">${escapeHtml(message)}</div>
            <div class="small muted" style="margin-top:5px">โปรดรอสักครู่</div>
          </div>
        </div>`;
    }

    function showModal({ title, description = "", body = "", footer = "", wide = false, closeable = true }) {
      const root = $("#modalRoot");
      root.innerHTML = `
        <div class="modal-backdrop" data-modal-backdrop>
          <section class="modal ${wide ? "modal-wide" : ""}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="modal-header">
              <div>
                <h3 class="modal-title">${escapeHtml(title)}</h3>
                ${description ? `<div class="modal-description">${escapeHtml(description)}</div>` : ""}
              </div>
              ${closeable ? `<button type="button" class="modal-close" data-modal-close aria-label="ปิด">${icon("x")}</button>` : ""}
            </div>
            <div class="modal-body">${body}</div>
            ${footer ? `<div class="modal-footer">${footer}</div>` : ""}
          </section>
        </div>`;

      if (closeable) {
        $("[data-modal-close]", root)?.addEventListener("click", closeModal);
        $("[data-modal-backdrop]", root)?.addEventListener("click", (event) => {
          if (event.target.matches("[data-modal-backdrop]")) closeModal();
        });
      }
      return root;
    }

    function closeModal() {
      $("#modalRoot").innerHTML = "";
      state.editor = null;
    }

    function confirmDialog({ title = "ยืนยันการดำเนินการ", message = "ต้องการดำเนินการนี้หรือไม่", confirmText = "ยืนยัน", danger = true }) {
      return new Promise(resolve => {
        const root = showModal({
          title,
          body: `
            <div class="confirm-content">
              <div class="confirm-icon">${icon(danger ? "trash" : "alert")}</div>
              <h3>${escapeHtml(title)}</h3>
              <p>${escapeHtml(message)}</p>
            </div>`,
          footer: `
            <button type="button" class="btn btn-secondary" data-cancel>ยกเลิก</button>
            <button type="button" class="btn ${danger ? "btn-danger" : "btn-primary"}" data-confirm>${escapeHtml(confirmText)}</button>`
        });
        $("[data-cancel]", root).addEventListener("click", () => { closeModal(); resolve(false); });
        $("[data-confirm]", root).addEventListener("click", () => { closeModal(); resolve(true); });
      });
    }

    function getErrorMessage(error) {
      const code = error?.code || "";
      if (code.includes("auth/invalid-credential") || code.includes("auth/wrong-password") || code.includes("auth/user-not-found")) {
        return "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
      }
      if (code.includes("auth/too-many-requests")) return "มีการลองเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่";
      if (code.includes("permission-denied") || code.includes("functions/permission-denied")) {
        return "ไม่มีสิทธิ์ดำเนินการนี้ กรุณาตรวจสอบบทบาทผู้ใช้งาน";
      }
      if (code.includes("unauthenticated")) return "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่";
      if (code.includes("unavailable")) return "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่";
      return error?.message || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
    }

    async function callApi(action, payload = {}) {
      const result = await dashboardApi({ action, ...payload });
      if (!result?.data) throw new Error("เซิร์ฟเวอร์ไม่ได้ส่งข้อมูลกลับมา");
      if (result.data.ok === false) throw new Error(result.data.message || "ไม่สามารถดำเนินการได้");
      return result.data;
    }

    function navMarkup() {
      const adminItems = [
        { id: "dashboard", label: "แดชบอร์ด", icon: "dashboard", section: "ภาพรวม" },
        { id: "albums", label: "จัดการอัลบั้ม", icon: "folder", section: "จัดการข้อมูล" },
        { id: "users", label: "จัดการผู้ใช้งาน", icon: "users", section: "จัดการข้อมูล" },
        { id: "organizations", label: "หน่วยงานและองค์กร", icon: "building", section: "จัดการข้อมูล" },
        { id: "categories", label: "จัดการหมวดหมู่", icon: "tag", section: "จัดการข้อมูล" }
      ];

      const managerItems = [
        { id: "dashboard", label: "แดชบอร์ด", icon: "dashboard", section: "ภาพรวม" },
        { id: "albums", label: "จัดการอัลบั้ม", icon: "folder", section: "จัดการอัลบั้ม" }
      ];

      const items = isAdmin() ? adminItems : managerItems;
      let lastSection = "";
      return items.map(item => {
        let section = "";
        if (item.section !== lastSection) {
          section = `<div class="nav-label">${escapeHtml(item.section)}</div>`;
          lastSection = item.section;
        }
        return `${section}
          <button type="button" class="nav-item ${state.currentPage === item.id ? "active" : ""}" data-page="${item.id}">
            ${icon(item.icon)}<span>${escapeHtml(item.label)}</span>
          </button>`;
      }).join("") + `
        <div class="nav-label">ช่วยเหลือ</div>
        <button type="button" class="nav-item" data-contact>${icon("help")}<span>ติดต่อผู้ดูแลระบบ</span></button>`;
    }

    function renderShell() {
      $("#loginScreen").classList.add("hidden");
      $("#appShell").classList.remove("hidden");
      $("#sidebarNav").innerHTML = navMarkup();
      $("#sidebarUserName").textContent = displayName();
      $("#sidebarUserOrg").textContent = organizationName();
      $("#topUserName").textContent = displayName();
      $("#topUserOrg").textContent = organizationName();

      $$("#sidebarNav [data-page]").forEach(button => {
        button.addEventListener("click", () => navigate(button.dataset.page));
      });
      $$("#sidebarNav [data-contact]").forEach(button => {
        button.addEventListener("click", showContactModal);
      });
    }

    function navigate(page) {
      const allowed = isAdmin()
        ? ["dashboard", "albums", "users", "organizations", "categories"]
        : ["dashboard", "albums"];

      if (!allowed.includes(page)) {
        showToast("ไม่มีสิทธิ์เข้าถึง", "บัญชีนี้ไม่สามารถเปิดเมนูดังกล่าวได้", "error");
        return;
      }

      state.currentPage = page;
      state.selectedPhotos.clear();
      $("#sidebarNav").innerHTML = navMarkup();
      $$("#sidebarNav [data-page]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.page)));
      $$("#sidebarNav [data-contact]").forEach(button => button.addEventListener("click", showContactModal));
      $("#sidebar").classList.remove("open");
      $("#mobileOverlay").classList.remove("show");

      const headings = {
        dashboard: ["แดชบอร์ด", "ภาพรวมการจัดการอัลบั้มภาพกิจกรรม"],
        albums: ["จัดการอัลบั้ม", isAdmin() ? "จัดการอัลบั้มภาพทุกหน่วยงาน" : "จัดการอัลบั้มของหน่วยงานคุณ"],
        users: ["จัดการผู้ใช้งาน", "เพิ่มและจัดการบัญชีผู้จัดการอัลบั้ม"],
        organizations: ["หน่วยงานและองค์กร", "จัดการหน่วยงานและโลโก้"],
        categories: ["จัดการหมวดหมู่", "จัดการหมวดหมู่ของอัลบั้มกิจกรรม"]
      };

      $("#pageHeading").textContent = headings[page]?.[0] || "ActiGallery";
      $("#pageSubheading").textContent = headings[page]?.[1] || "";
      renderPage();
    }

    async function refreshData() {
      const result = await callApi("dashboardInit");
      state.profile = result.profile || result.user || state.profile;
      state.role = state.profile?.role || state.role;
      state.organizations = Array.isArray(result.organizations) ? result.organizations : [];
      state.users = Array.isArray(result.users) ? result.users : [];
      state.categories = Array.isArray(result.categories) ? result.categories : [];
      state.albums = Array.isArray(result.albums) ? result.albums : [];
      state.lastDashboard = result.stats || result.dashboard || null;

      if (!["admin", "album_manager"].includes(state.role)) {
        throw new Error("บัญชีนี้ยังไม่ได้รับสิทธิ์ Admin หรือ Album Manager");
      }
    }

    function renderPage() {
      const root = $("#pageContent");
      if (state.currentPage === "dashboard") root.innerHTML = dashboardMarkup();
      else if (state.currentPage === "albums") root.innerHTML = albumsMarkup();
      else if (state.currentPage === "users" && isAdmin()) root.innerHTML = usersMarkup();
      else if (state.currentPage === "organizations" && isAdmin()) root.innerHTML = organizationsMarkup();
      else if (state.currentPage === "categories" && isAdmin()) root.innerHTML = categoriesMarkup();
      else {
        state.currentPage = "dashboard";
        root.innerHTML = dashboardMarkup();
      }
      bindPageEvents();
    }

    function dashboardMarkup() {
      const stats = state.lastDashboard || {};
      const photoCount = Number(stats.photoCount ?? state.albums.reduce((sum, album) => sum + Number(album.photoCount || 0), 0));
      const albumCount = Number(stats.albumCount ?? state.albums.length);
      const orgCount = Number(stats.organizationCount ?? state.organizations.length);
      const userCount = Number(stats.userCount ?? state.users.length);

      const cards = isAdmin() ? [
        ["รูปภาพทั้งหมด", photoCount, "image", "จำนวนภาพในระบบ"],
        ["อัลบั้มทั้งหมด", albumCount, "folder", "อัลบั้มทุกหน่วยงาน"],
        ["หน่วยงานทั้งหมด", orgCount, "building", "หน่วยงานและองค์กร"],
        ["ผู้ใช้งานทั้งหมด", userCount, "users", "บัญชีที่มีอยู่ในระบบ"]
      ] : [
        ["รูปภาพที่อัปโหลด", photoCount, "image", "รูปภาพในหน่วยงานของคุณ"],
        ["อัลบั้มทั้งหมด", albumCount, "folder", "อัลบั้มของหน่วยงานของคุณ"]
      ];

      const recent = [...state.albums]
        .sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0))
        .slice(0, 6);

      return `
        <div class="welcome-row">
          <div>
            <h1 class="welcome-title">สวัสดี, ${escapeHtml(displayName())}</h1>
            <p class="welcome-desc">ยินดีต้อนรับสู่ระบบจัดการอัลบั้มภาพกิจกรรม ActiGallery</p>
          </div>
          <button type="button" class="btn btn-primary" data-action="new-album">${icon("plus")} สร้างอัลบั้มใหม่</button>
        </div>

        <div class="stats-grid ${isAdmin() ? "" : "manager-stats"}">
          ${cards.map(([label, value, iconName, foot]) => `
            <article class="stat-card">
              <div class="stat-top">
                <div class="stat-label">${escapeHtml(label)}</div>
                <div class="stat-icon">${icon(iconName)}</div>
              </div>
              <div class="stat-number">${formatNumber(value)}</div>
              <div class="stat-foot">${escapeHtml(foot)}</div>
            </article>
          `).join("")}
        </div>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h3 class="panel-title">อัลบั้มล่าสุด</h3>
              <div class="panel-subtitle">${isAdmin() ? "อัลบั้มที่มีการสร้างหรือแก้ไขล่าสุด" : "อัลบั้มล่าสุดในหน่วยงานของคุณ"}</div>
            </div>
            <button class="btn btn-secondary btn-sm" type="button" data-action="go-albums">ดูอัลบั้มทั้งหมด ${icon("chevron")}</button>
          </div>
          ${recent.length ? `
            <div class="album-grid" style="padding:0 20px 20px">
              ${recent.map(albumCardMarkup).join("")}
            </div>
          ` : `
            <div class="empty-state">
              ${icon("folder")}
              <strong>ยังไม่มีอัลบั้ม</strong>
              <div>เริ่มต้นด้วยการสร้างอัลบั้มกิจกรรมแรกของคุณ</div>
              <button type="button" class="btn btn-primary" style="margin-top:15px" data-action="new-album">${icon("plus")} สร้างอัลบั้ม</button>
            </div>
          `}
        </section>

        ${isAdmin() ? `
          <section class="panel">
            <div class="panel-header">
              <div>
                <h3 class="panel-title">สถานะระบบ</h3>
                <div class="panel-subtitle">ข้อมูลภาพรวมจากฐานข้อมูล</div>
              </div>
              <span class="badge badge-success"><span class="status-dot"></span> เชื่อมต่อหน้าแดชบอร์ดแล้ว</span>
            </div>
            <div class="panel-body">
              <div class="status-line">${icon("building")} หน่วยงานที่ลงทะเบียน ${formatNumber(orgCount)} หน่วยงาน</div>
              <div class="divider"></div>
              <div class="status-line">${icon("users")} บัญชีผู้ใช้งาน ${formatNumber(userCount)} บัญชี</div>
              <div class="divider"></div>
              <div class="status-line">${icon("image")} จำนวนภาพในระบบ ${formatNumber(photoCount)} ภาพ</div>
            </div>
          </section>
        ` : ""}
      `;
    }

    function albumCardMarkup(album) {
      const cover = safeUrl(album.coverUrl || album.thumbnailUrl || album.photos?.[0]?.url);
      const status = album.status === "published" ? `<span class="badge badge-success">เผยแพร่แล้ว</span>` : `<span class="badge badge-warning">ยังไม่เผยแพร่</span>`;
      return `
        <article class="album-card">
          ${cover ? `<img class="album-cover" src="${escapeHtml(cover)}" alt="${escapeHtml(album.title || "ภาพปกอัลบั้ม")}" loading="lazy">`
            : `<div class="album-no-cover">${icon("image")}</div>`}
          <div class="album-card-body">
            <h4 class="album-card-title">${escapeHtml(album.title || "ไม่มีชื่ออัลบั้ม")}</h4>
            <div class="album-card-description">${escapeHtml(album.description || "ไม่มีรายละเอียด")}</div>
            <div class="album-meta">
              <span class="small muted">${formatNumber(album.photoCount || 0)} รูป</span>
              ${status}
            </div>
            <div class="album-card-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-edit-album="${escapeHtml(album.id)}">${icon("edit")} แก้ไข</button>
            </div>
          </div>
        </article>`;
    }

    function albumsMarkup() {
      const query = state.activeSearch.toLowerCase();
      const filtered = state.albums.filter(album => {
        const text = `${album.title || ""} ${album.description || ""} ${album.organizationName || ""}`.toLowerCase();
        const searchMatch = text.includes(query);
        const filterMatch = state.activeFilter === "all" || (state.activeFilter === "published" ? album.status === "published" : album.status !== "published");
        return searchMatch && filterMatch;
      });

      return `
        <div class="welcome-row">
          <div>
            <h1 class="welcome-title">จัดการอัลบั้ม</h1>
            <p class="welcome-desc">${isAdmin() ? "ดูแลอัลบั้มภาพของทุกหน่วยงานในระบบ" : "สร้างและจัดการอัลบั้มภาพของหน่วยงานคุณ"}</p>
          </div>
          <button type="button" class="btn btn-primary" data-action="new-album">${icon("plus")} สร้างอัลบั้ม</button>
        </div>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h3 class="panel-title">อัลบั้มทั้งหมด</h3>
              <div class="panel-subtitle">พบ ${formatNumber(filtered.length)} อัลบั้ม</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="toolbar">
              <div class="search-input" style="position:relative">
                <input id="albumSearch" placeholder="ค้นหาชื่ออัลบั้ม รายละเอียด หรือหน่วยงาน..." value="${escapeHtml(state.activeSearch)}" aria-label="ค้นหาอัลบั้ม">
              </div>
              <select id="albumStatusFilter" aria-label="กรองสถานะ">
                <option value="all" ${state.activeFilter === "all" ? "selected" : ""}>ทุกสถานะ</option>
                <option value="published" ${state.activeFilter === "published" ? "selected" : ""}>เผยแพร่แล้ว</option>
                <option value="unpublished" ${state.activeFilter === "unpublished" ? "selected" : ""}>ยังไม่เผยแพร่</option>
              </select>
            </div>

            ${filtered.length ? `<div class="album-grid">${filtered.map(albumCardMarkup).join("")}</div>` : `
              <div class="empty-state">
                ${icon("folder")}
                <strong>${state.albums.length ? "ไม่พบอัลบั้มที่ค้นหา" : "ยังไม่มีอัลบั้มในระบบ"}</strong>
                <div>${state.albums.length ? "ลองเปลี่ยนคำค้นหาหรือตัวกรอง" : "กดสร้างอัลบั้มเพื่อเริ่มต้น"}</div>
              </div>
            `}
          </div>
        </section>`;
    }

    function usersMarkup() {
      return `
        <div class="welcome-row">
          <div>
            <h1 class="welcome-title">จัดการผู้ใช้งาน</h1>
            <p class="welcome-desc">สร้างบัญชีผู้จัดการอัลบั้มและกำหนดหน่วยงานที่รับผิดชอบ</p>
          </div>
          <button type="button" class="btn btn-primary" data-action="new-user">${icon("plus")} เพิ่มผู้ใช้งาน</button>
        </div>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h3 class="panel-title">บัญชีผู้ใช้งานทั้งหมด</h3>
              <div class="panel-subtitle">ข้อมูลบัญชีและหน่วยงานที่ได้รับมอบหมาย</div>
            </div>
          </div>
          <div class="panel-body">
            <div class="toolbar" style="margin-bottom:16px">
              <input class="search-input" id="userSearch" placeholder="ค้นหาชื่อ ชื่อผู้ใช้ หรือหน่วยงาน...">
            </div>
            <div id="usersTableContainer">${usersTableMarkup(state.users)}</div>
          </div>
        </section>`;
    }

    function usersTableMarkup(users) {
      if (!users.length) {
        return `<div class="empty-state">${icon("users")}<strong>ยังไม่มีบัญชีผู้ใช้งาน</strong><div>เพิ่มผู้จัดการอัลบั้มได้จากปุ่มด้านบน</div></div>`;
      }

      return `<div class="table-wrap"><table>
        <thead><tr><th>ชื่อ-สกุล</th><th>ชื่อผู้ใช้</th><th>หน่วยงาน</th><th>สิทธิ์</th><th>การจัดการ</th></tr></thead>
        <tbody>${users.map(user => `
          <tr>
            <td><div class="table-primary">${escapeHtml(user.fullName || user.name || "—")}</div><div class="table-secondary">${escapeHtml(user.email || "")}</div></td>
            <td>${escapeHtml(user.username || "—")}</td>

    function bindAlbumEditorEvents(root) {
      const input = $("#albumPhotoInput", root);
      const chooseButton = $("#choosePhotosButton", root);
      const addButton = $("#addMorePhotos", root);
      const dropZone = $("#photoDropZone", root);

      chooseButton.addEventListener("click", () => input.click());
      addButton.addEventListener("click", () => input.click());
      input.addEventListener("change", event => {
        addLocalFiles([...event.target.files || []]);
        event.target.value = "";
      });

      dropZone.addEventListener("dragover", event => {
        event.preventDefault();
        dropZone.classList.add("drag-over");
      });

      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));

      dropZone.addEventListener("drop", event => {
        event.preventDefault();
        dropZone.classList.remove("drag-over");
        const files = [...event.dataTransfer.files].filter(file => file.type.startsWith("image/"));
        addLocalFiles(files);
      });

      $("#togglePhotoSelect", root).addEventListener("click", () => {
        const enabled = $("#togglePhotoSelect", root).dataset.enabled !== "true";
        $("#togglePhotoSelect", root).dataset.enabled = String(enabled);
        $("#togglePhotoSelect", root).innerHTML = enabled ? `${icon("x")} ยกเลิกเลือก` : `${icon("check")} เลือก`;
        renderPhotoGrid();
      });

      $("#cancelAlbumButton", root).addEventListener("click", async () => {
        if (state.editor?.uploading) return;
        const hasNew = state.editor?.photos.some(photo => photo.source === "local");
        if (hasNew) {
          const yes = await confirmDialog({ title: "ยกเลิกการแก้ไข?", message: "รูปที่ยังไม่ได้อัปโหลดจะไม่ถูกบันทึก", confirmText: "ยกเลิกการแก้ไข", danger: true });
          if (!yes) return;
        }
        closeModal();
      });

      $("#saveAlbumButton", root).addEventListener("click", saveAlbumFromEditor);
    }

    function addLocalFiles(files) {
      if (!state.editor) return;
      const valid = files.filter(file => file.type.startsWith("image/"));
      if (!valid.length) {
        showToast("ไม่พบไฟล์รูปภาพ", "กรุณาเลือกไฟล์รูปภาพที่รองรับ", "warning");
        return;
      }

      const rejected = [];
      valid.forEach(file => {
        if (file.size > 20 * 1024 * 1024) {
          rejected.push(file.name);
          return;
        }
        state.editor.photos.push({
          id: `local-${crypto.randomUUID()}`,
          url: URL.createObjectURL(file),
          thumbnailUrl: URL.createObjectURL(file),
          name: file.name,
          source: "local",
          file,
          selected: false,
          persistedId: null
        });
      });

      renderPhotoGrid();

      if (rejected.length) {
        showToast("มีไฟล์ที่ใหญ่เกินกำหนด", `${rejected.length} ไฟล์มีขนาดเกิน 20 MB ต่อไฟล์`, "warning");
      }
      if (valid.length) showToast("เพิ่มรูปภาพแล้ว", `เพิ่มไฟล์ที่เลือกได้ ${valid.length - rejected.length} รูป`, "success");
    }

    function renderPhotoGrid() {
      const editor = state.editor;
      if (!editor) return;

      const grid = $("#photoGrid");
      const empty = $("#photoEmptyState");
      const countLabel = $("#photoCountLabel");
      if (!grid || !empty || !countLabel) return;

      const selecting = $("#togglePhotoSelect")?.dataset.enabled === "true";
      countLabel.textContent = `${formatNumber(editor.photos.length)} รูป`;
      empty.classList.toggle("hidden", editor.photos.length > 0);

      grid.innerHTML = editor.photos.map((photo, index) => {
        const selected = state.selectedPhotos.has(photo.id);
        const src = safeUrl(photo.url) || photo.url;
        return `
          <div class="photo-item ${selected ? "is-selected" : ""}" draggable="true" data-photo-id="${escapeHtml(photo.id)}" data-photo-index="${index}" tabindex="0" aria-label="รูปภาพลำดับ ${index + 1}">
            <img src="${escapeHtml(src)}" alt="${escapeHtml(photo.name)}" loading="lazy">
            ${selecting ? `<span class="photo-selection">${selected ? icon("check") : ""}</span>` : ""}
            <span class="photo-index">${index + 1}</span>
          </div>`;
      }).join("");

      $$(".photo-item", grid).forEach(item => {
        item.addEventListener("click", event => {
          if (selecting) {
            togglePhotoSelected(item.dataset.photoId);
          } else {
            openPhotoViewer(Number(item.dataset.photoIndex));
          }
        });

        item.addEventListener("contextmenu", event => {
          event.preventDefault();
          const button = $("#togglePhotoSelect");
          if (button && button.dataset.enabled !== "true") {
            button.dataset.enabled = "true";
            button.innerHTML = `${icon("x")} ยกเลิกเลือก`;
          }
          togglePhotoSelected(item.dataset.photoId);
          renderPhotoGrid();
        });

        item.addEventListener("dragstart", event => {
          state.photoDragId = item.dataset.photoId;
          item.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", item.dataset.photoId);
        });

        item.addEventListener("dragend", () => {
          state.photoDragId = null;
          $$(".photo-item", grid).forEach(el => el.classList.remove("dragging", "drag-target"));
        });

        item.addEventListener("dragover", event => {
          event.preventDefault();
          if (state.photoDragId && state.photoDragId !== item.dataset.photoId) item.classList.add("drag-target");
        });

        item.addEventListener("dragleave", () => item.classList.remove("drag-target"));

        item.addEventListener("drop", event => {
          event.preventDefault();
          const fromId = state.photoDragId || event.dataTransfer.getData("text/plain");
          reorderEditorPhoto(fromId, item.dataset.photoId);
        });

        bindTouchReorder(item);
      });

      renderFloatingSelectionBar();
    }

    function bindTouchReorder(item) {
      let startX = 0;
      let startY = 0;
      let startTime = 0;
      let longPressed = false;
      let holdTimer = null;

      item.addEventListener("touchstart", event => {
        if (event.touches.length !== 1) return;
        const touch = event.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startTime = Date.now();
        longPressed = false;
        holdTimer = window.setTimeout(() => {
          longPressed = true;
          state.photoDragId = item.dataset.photoId;
          item.classList.add("dragging");
          if (navigator.vibrate) navigator.vibrate(25);
          showToast("กำลังจัดเรียงรูป", "ลากนิ้วไปยังตำแหน่งที่ต้องการ แล้วปล่อยนิ้ว", "info", 1800);
        }, 450);
      }, { passive: true });

      item.addEventListener("touchmove", event => {
        if (!state.photoDragId || !longPressed) {
          if (holdTimer && (Math.abs(event.touches[0].clientX - startX) > 10 || Math.abs(event.touches[0].clientY - startY) > 10)) {
            clearTimeout(holdTimer);
          }
          return;
        }

        const touch = event.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest(".photo-item");
        $$(".photo-item").forEach(el => el.classList.remove("drag-target"));
        if (target && target.dataset.photoId !== state.photoDragId) target.classList.add("drag-target");
      }, { passive: true });

      item.addEventListener("touchend", event => {
        if (holdTimer) clearTimeout(holdTimer);
        if (!longPressed || !state.photoDragId) return;

        const touch = event.changedTouches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest(".photo-item");
        if (target && target.dataset.photoId !== state.photoDragId) {
          reorderEditorPhoto(state.photoDragId, target.dataset.photoId);
        } else {
          item.classList.remove("dragging");
          state.photoDragId = null;
        }
      }, { passive: true });
    }

    function reorderEditorPhoto(fromId, toId) {
      const editor = state.editor;
      if (!editor || !fromId || !toId || fromId === toId) return;

      const fromIndex = editor.photos.findIndex(photo => photo.id === fromId);
      const toIndex = editor.photos.findIndex(photo => photo.id === toId);
      if (fromIndex < 0 || toIndex < 0) return;

      const [moved] = editor.photos.splice(fromIndex, 1);
      editor.photos.splice(toIndex, 0, moved);
      state.photoDragId = null;
      renderPhotoGrid();
    }

    function togglePhotoSelected(photoId) {
      if (state.selectedPhotos.has(photoId)) state.selectedPhotos.delete(photoId);
      else state.selectedPhotos.add(photoId);

    function duplicateSelectedPhotos() {
      const editor = state.editor;
      if (!editor) return;

      const indices = editor.photos
        .map((photo, index) => state.selectedPhotos.has(photo.id) ? index : -1)
        .filter(index => index >= 0)
        .sort((a, b) => a - b);

      if (!indices.length) return;

      let added = 0;
      indices.forEach(index => {
        const original = editor.photos[index + added];
        if (!original) return;

        if (original.source === "local" && original.file) {
          const duplicateFile = new File([original.file], `copy-${original.file.name}`, {
            type: original.file.type,
            lastModified: Date.now()
          });
          const duplicate = {
            ...original,
            id: `local-${crypto.randomUUID()}`,
            file: duplicateFile,
            name: duplicateFile.name,
            url: URL.createObjectURL(duplicateFile),
            thumbnailUrl: URL.createObjectURL(duplicateFile),
            persistedId: null,
            source: "local",
            selected: false
          };
          editor.photos.splice(index + added + 1, 0, duplicate);
          added++;
        } else {
          /*
           * รูปที่อยู่บนเซิร์ฟเวอร์จะทำสำเนารายการอ้างอิงรูปเดิม
           * Backend ต้องบันทึก photo document ใหม่สำหรับรายการสำเนานี้
           */
          const duplicate = {
            ...original,
            id: `copy-${crypto.randomUUID()}`,
            name: `สำเนา ${original.name || "รูปภาพ"}`,
            source: "remote-copy",
            persistedId: null,
            file: null
          };
          editor.photos.splice(index + added + 1, 0, duplicate);
          added++;
        }
      });

      state.selectedPhotos.clear();
      renderPhotoGrid();
      showToast("ทำซ้ำรูปภาพแล้ว", `เพิ่มรายการรูปภาพ ${added} รูป`, "success");
    }

    async function saveAlbumFromEditor() {
      const editor = state.editor;
      if (!editor || editor.uploading) return;

      const form = $("#albumForm");
      if (!form.reportValidity()) return;

      const title = $("#albumTitle").value.trim();
      const description = $("#albumDescription").value.trim();
      const categoryId = $("#albumCategory").value;
      const eventDate = $("#albumDate").value || "";
      const organizationId = $("#albumOrganization").value;

      if (!title) {
        showToast("กรุณากรอกชื่ออัลบั้ม", "", "warning");
        return;
      }
      if (!categoryId) {
        showToast("กรุณาเลือกหมวดหมู่", "อัลบั้มทุกอัลบั้มต้องมีหมวดหมู่", "warning");
        return;
      }
      if (!organizationId) {
        showToast("กรุณาเลือกหน่วยงาน", "", "warning");
        return;
      }
      if (!editor.photos.length) {
        showToast("ยังไม่มีรูปภาพ", "กรุณาเลือกรูปภาพอย่างน้อยหนึ่งรูป", "warning");
        return;
      }

      setAlbumEditorBusy(true);

      try {
        updateUploadProgress(2, "กำลังบันทึกรายละเอียดอัลบั้ม...");
        const albumData = {
          albumId: editor.albumId,
          title,
          description,
          categoryId,
          eventDate,
          organizationId
        };

        const saved = await callApi("saveAlbum", albumData);
        const albumId = saved.albumId || saved.id || editor.albumId;
        if (!albumId) throw new Error("Backend ไม่ส่ง albumId กลับมา");

        const total = editor.photos.length;
        const photoRecords = [];

        for (let i = 0; i < total; i++) {
          const photo = editor.photos[i];
          const progressBase = 5 + (i / total) * 85;
          updateUploadProgress(progressBase, `กำลังเตรียมรูปที่ ${i + 1} จาก ${total}: ${photo.name || "รูปภาพ"}`);

          if (photo.source === "local" && photo.file) {
            const base64 = await fileToBase64(photo.file);
            const uploadResult = await uploadImage({
              purpose: "photo",
              albumId,
              fileName: photo.file.name,
              mimeType: photo.file.type || "image/jpeg",
              base64
            });

            const uploadData = uploadResult.data || {};
            const url = uploadData.url || uploadData.imageUrl || uploadData.displayUrl;
            if (!url) throw new Error(`เซิร์ฟเวอร์ไม่ได้ส่ง URL ของรูปที่ ${i + 1} กลับมา`);

            photoRecords.push({
              id: uploadData.photoId || uploadData.id || photo.persistedId || undefined,
              url,
              thumbnailUrl: uploadData.thumbnailUrl || url,
              name: photo.name,
              order: i,
              duplicateOf: null
            });
          } else {
            photoRecords.push({
              id: photo.persistedId || (photo.source === "remote" ? photo.id : undefined),
              url: photo.url,
              thumbnailUrl: photo.thumbnailUrl || photo.url,
              name: photo.name,
              order: i,
              duplicateOf: photo.source === "remote-copy" ? photo.persistedId || photo.id : null
            });
          }

          updateUploadProgress(
            5 + ((i + 1) / total) * 85,
            `ดำเนินการแล้ว ${i + 1} จาก ${total} รูป`
          );
        }

        updateUploadProgress(92, "กำลังบันทึกลำดับรูปภาพ...");
        await callApi("saveAlbumPhotos", {
          albumId,
          photos: photoRecords.map((photo, index) => ({ ...photo, order: index }))
        });

        updateUploadProgress(97, "กำลังเผยแพร่อัลบั้ม...");
        await callApi("publishAlbum", { albumId });

        updateUploadProgress(100, "อัปโหลดและบันทึกข้อมูลครบแล้ว", "อัปโหลดอัลบั้มเสร็จสิ้น");
        await refreshData();

        window.setTimeout(() => {
          closeModal();
          $("#floatingBarRoot").innerHTML = "";
          renderPage();
          showToast("อัปโหลดอัลบั้มเสร็จสิ้น", `บันทึกอัลบั้ม “${title}” แล้ว`, "success", 5000);
        }, 450);
      } catch (error) {
        console.error("saveAlbumFromEditor failed:", error);
        updateUploadProgress(0, getErrorMessage(error), "อัปโหลดไม่สำเร็จ");
        showToast("อัปโหลดอัลบั้มไม่สำเร็จ", getErrorMessage(error), "error", 6000);
      } finally {
        if (state.editor) setAlbumEditorBusy(false);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error(`อ่านไฟล์ ${file.name} ไม่สำเร็จ`));
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          if (comma < 0) return reject(new Error("รูปแบบไฟล์ Base64 ไม่ถูกต้อง"));
          resolve(result.slice(comma + 1));
        };
        reader.readAsDataURL(file);
      });
    }

            });
            logoUrl = result.data?.url || result.data?.imageUrl || result.data?.displayUrl || "";
            if (!logoUrl) throw new Error("ไม่พบ URL โลโก้จากเซิร์ฟเวอร์");
          }

          await callApi("saveOrganization", {
            organizationId: existing?.id || null,
            name,
            logoUrl
          });

          await refreshData();
          closeModal();
          renderPage();
          showToast("บันทึกหน่วยงานสำเร็จ", "", "success");
        } catch (error) {
          showToast("บันทึกหน่วยงานไม่สำเร็จ", getErrorMessage(error), "error");
        } finally {
          setLoading(false);
        }
      });
    }

    async function deleteOrganization(organizationId) {
      if (!isAdmin()) return;
      const organization = state.organizations.find(item => item.id === organizationId);
      if (!organization) return;

      const users = state.users.filter(user => user.organizationId === organizationId).length;
      const albums = state.albums.filter(album => album.organizationId === organizationId).length;
      const yes = await confirmDialog({
        title: "ลบหน่วยงานนี้?",
        message: `หน่วยงาน “${organization.name}” มีผู้ใช้งาน ${users} บัญชี และอัลบั้ม ${albums} อัลบั้ม กรุณาตรวจสอบข้อมูลก่อนลบ`,
        confirmText: "ลบหน่วยงาน"
      });
      if (!yes) return;

      try {
        setLoading(true, "กำลังลบหน่วยงาน...");
        await callApi("deleteOrganization", { organizationId });
        await refreshData();
        renderPage();
        showToast("ลบหน่วยงานสำเร็จ", "", "success");
      } catch (error) {
        showToast("ลบหน่วยงานไม่สำเร็จ", getErrorMessage(error), "error");
      } finally {
        setLoading(false);
      }
    }

    function openCategoryEditor(categoryId = null) {
      if (!isAdmin()) return;
      const existing = categoryId ? state.categories.find(item => item.id === categoryId) : null;
      const root = showModal({
        title: existing ? "แก้ไขหมวดหมู่" : "เพิ่มหมวดหมู่",
        body: `
          <form id="categoryForm">
            <div class="field">
              <label for="categoryName">ชื่อหมวดหมู่ *</label>
              <input id="categoryName" required maxlength="100" value="${escapeHtml(existing?.name || "")}" placeholder="เช่น กิจกรรมโรงเรียน">
            </div>
          </form>`,
        footer: `
          <button type="button" class="btn btn-secondary" data-category-cancel>ยกเลิก</button>
          <button type="button" class="btn btn-primary" data-category-save>${icon("check")} บันทึกหมวดหมู่</button>`
      });

      $("[data-category-cancel]", root).addEventListener("click", closeModal);
      $("[data-category-save]", root).addEventListener("click", async () => {
        const form = $("#categoryForm", root);
        if (!form.reportValidity()) return;
        const name = $("#categoryName", root).value.trim();

        try {
          setLoading(true, "กำลังบันทึกหมวดหมู่...");
          await callApi("saveCategory", { categoryId: existing?.id || null, name });
          await refreshData();
          closeModal();
          renderPage();
          showToast("บันทึกหมวดหมู่สำเร็จ", "", "success");
        } catch (error) {
          showToast("บันทึกหมวดหมู่ไม่สำเร็จ", getErrorMessage(error), "error");
        } finally {
          setLoading(false);
        }
      });
    }

    async function deleteCategory(categoryId) {
      if (!isAdmin()) return;
      const category = state.categories.find(item => item.id === categoryId);
      if (!category) return;

      const count = state.albums.filter(album => album.categoryId === categoryId).length;
      const yes = await confirmDialog({
        title: "ลบหมวดหมู่?",
        message: `หมวดหมู่ “${category.name}” ถูกใช้อยู่ใน ${count} อัลบั้ม`,
        confirmText: "ลบหมวดหมู่"
      });
      if (!yes) return;

      try {
        setLoading(true, "กำลังลบหมวดหมู่...");
        await callApi("deleteCategory", { categoryId });
        await refreshData();
        renderPage();
        showToast("ลบหมวดหมู่สำเร็จ", "", "success");
      } catch (error) {
        showToast("ลบหมวดหมู่ไม่สำเร็จ", getErrorMessage(error), "error");
      } finally {
        setLoading(false);
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const username = $("#loginUsername").value.trim();
      const password = $("#loginPassword").value;
      const errorBox = $("#loginError");
      const button = $("#loginButton");

      errorBox.classList.add("hidden");
      button.disabled = true;
      button.innerHTML = `<span class="spinner" style="width:17px;height:17px;border-width:2px;margin:0"></span> กำลังเข้าสู่ระบบ...`;

      try {
        const email = usernameToAuthEmail(username);
        await signInWithEmailAndPassword(auth, email, password);
        $("#loginPassword").value = "";
      } catch (error) {
        errorBox.textContent = getErrorMessage(error);
        errorBox.classList.remove("hidden");
      } finally {
        button.disabled = false;
        button.innerHTML = `${icon("user")} เข้าสู่ระบบ`;
      }
    }

    async function handleAuthenticatedUser(user) {
      if (!user) {
        state.user = null;
        state.profile = null;
        state.role = null;
        $("#appShell").classList.add("hidden");
        $("#loginScreen").classList.remove("hidden");
        return;
      }

      state.user = user;
      setLoading(true, "กำลังโหลดข้อมูลบัญชี...");
      try {
        await refreshData();
        renderShell();
        navigate("dashboard");
      } catch (error) {
        console.error("Loading dashboard failed:", error);
        await signOut(auth);
        $("#loginError").textContent = getErrorMessage(error);
        $("#loginError").classList.remove("hidden");
        showToast("เปิดระบบไม่สำเร็จ", getErrorMessage(error), "error", 6000);
      } finally {
        setLoading(false);
      }
    }

    $("#loginForm").addEventListener("submit", handleLogin);
    $("#helpLoginButton").addEventListener("click", showContactModal);
    $("#logoutButton").addEventListener("click", async () => {
      const yes = await confirmDialog({
        title: "ออกจากระบบ?",
        message: "คุณต้องการออกจากระบบ ActiGallery ใช่หรือไม่",
        confirmText: "ออกจากระบบ",
        danger: false
      });
      if (!yes) return;
      try {
        await signOut(auth);
        showToast("ออกจากระบบแล้ว", "", "success");
      } catch (error) {
        showToast("ออกจากระบบไม่สำเร็จ", getErrorMessage(error), "error");
      }
    });

    $("#mobileMenuButton").addEventListener("click", () => {
      $("#sidebar").classList.toggle("open");
      $("#mobileOverlay").classList.toggle("show");
    });

    $("#mobileOverlay").addEventListener("click", () => {
      $("#sidebar").classList.remove("open");
      $("#mobileOverlay").classList.remove("show");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if ($("#viewerRoot").innerHTML) $("#viewerRoot").innerHTML = "";
        else if ($("#modalRoot").innerHTML) closeModal();
        else {
          $("#sidebar").classList.remove("open");
          $("#mobileOverlay").classList.remove("show");
        }
      }
    });

    onAuthStateChanged(auth, handleAuthenticatedUser);
  </script>
</body>
